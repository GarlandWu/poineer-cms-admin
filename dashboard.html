<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>能源门户管理</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 450px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-size: 26px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-bottom: 30px;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 20px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 25px;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: white;
      transition: all 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-cms {
      background: linear-gradient(135deg, #3498db, #2980b9);
    }

    .btn-preview {
      background: linear-gradient(135deg, #27ae60, #229954);
    }

    .btn-publish {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
    }

    .status {
      padding: 16px;
      background: #f0f4f8;
      border-left: 4px solid #3498db;
      border-radius: 6px;
      color: #333;
      font-size: 14px;
      line-height: 1.6;
      min-height: 60px;
      display: flex;
      align-items: center;
    }

    .status.success {
      border-left-color: #27ae60;
      background: #f0fdf4;
      color: #1e7e34;
    }

    .status.error {
      border-left-color: #e74c3c;
      background: #fef2f2;
      color: #b91c1c;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #999;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #f0f0f0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ 能源门户管理</h1>
    <div class="subtitle">Energy Portal Manager</div>

    <div class="buttons">
      <button class="btn-cms" onclick="sendCmd('start-cms')">
        🚀 启动 CMS 后台
      </button>
      <button class="btn-preview" onclick="sendCmd('preview')">
        🌐 预览网站
      </button>
      <button class="btn-publish" onclick="sendCmd('publish')">
        📦 一键发布
      </button>
    </div>

    <div class="status" id="status">
      👋 就绪。点击按钮开始操作
    </div>

    <div class="footer">
      ✅ 服务运行中 | Node.js App
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
