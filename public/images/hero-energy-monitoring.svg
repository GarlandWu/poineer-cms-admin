<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="3D 能源监控数字孪生">
  <defs>
    <linearGradient id="screenGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#0f2f4d" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景渐变 -->
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="30%">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.08"/>
      <stop offset="100" stop-color="#2563eb" stop-opacity="0.05"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgGradient)"/>

  <!-- 左侧：能耗柱状图 -->
  <g opacity="0.7">
    <rect x="80" y="320" width="35" height="160" rx="4" fill="#2563eb" opacity="0.6"/>
    <rect x="130" y="280" width="35" height="200" rx="4" fill="#22c55e" opacity="0.7"/>
    <rect x="180" y="240" width="35" height="240" rx="4" fill="#2563eb" opacity="0.6"/>
    <rect x="230" y="200" width="35" height="280" rx="4" fill="#22c55e" opacity="0.7"/>
    <rect x="280" y="260" width="35" height="220" rx="4" fill="#2563eb" opacity="0.6"/>
    <rect x="330" y="180" width="35" height="300" rx="4" fill="#22c55e" opacity="0.7"/>
  </g>

  <!-- 中间：能源数据面板 -->
  <g>
    <!-- 面板背景 -->
    <rect x="450" y="150" width="300" height="320" rx="16" fill="url(#screenGradient)" stroke="#22c55e" stroke-width="2" opacity="0.8"/>

    <!-- 能耗线路 -->
    <polyline points="470,380 500,320 530,350 560,280 590,320 620,250 650,300 680,200 710,280"
              stroke="#22c55e" stroke-width="2" fill="none" filter="url(#glow)"/>

    <!-- 数据指标 -->
    <text x="470" y="180" fill="#22c55e" font-family="system-ui" font-size="16" font-weight="700">实时能耗</text>
    <text x="470" y="220" fill="#e2e8f0" font-family="system-ui" font-size="28" font-weight="700">2,847 kW</text>

    <text x="600" y="180" fill="#2563eb" font-family="system-ui" font-size="14" font-weight="600">效率</text>
    <text x="600" y="210" fill="#3b82f6" font-family="system-ui" font-size="20" font-weight="700">92.3%</text>

    <text x="470" y="280" fill="#64748b" font-family="system-ui" font-size="12">24h 能耗曲线</text>

    <!-- 底部指标条 -->
    <rect x="470" y="410" width="90" height="50" rx="8" fill="#0f2f4d" stroke="#22c55e" stroke-width="1"/>
    <text x="515" y="430" fill="#22c55e" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle">降碳量</text>
    <text x="515" y="450" fill="#86efac" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">↓ 23%</text>

    <rect x="580" y="410" width="90" height="50" rx="8" fill="#0f2f4d" stroke="#2563eb" stroke-width="1"/>
    <text x="625" y="430" fill="#2563eb" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle">成本节省</text>
    <text x="625" y="450" fill="#93c5fd" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">¥ 12.5M</text>
  </g>

  <!-- 右侧：3D 能效指示器 -->
  <g opacity="0.7">
    <!-- 内圆 -->
    <circle cx="950" cy="280" r="80" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.4"/>
    <circle cx="950" cy="280" r="70" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.6"/>
    <circle cx="950" cy="280" r="50" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.8"/>

    <!-- 中心数据 -->
    <text x="950" y="275" fill="#22c55e" font-family="system-ui" font-size="24" font-weight="700" text-anchor="middle">PUE</text>
    <text x="950" y="305" fill="#86efac" font-family="system-ui" font-size="32" font-weight="700" text-anchor="middle">1.32</text>

    <!-- 进度指示 -->
    <path d="M 950 200 A 80 80 0 0 1 1020 340" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <text x="1050" y="300" fill="#22c55e" font-family="system-ui" font-size="14" font-weight="600">优异</text>
  </g>

  <!-- 顶部装饰线条 -->
  <line x1="80" y1="120" x2="1100" y2="120" stroke="#22c55e" stroke-width="1" opacity="0.3"/>
  <circle cx="100" cy="120" r="3" fill="#22c55e" opacity="0.6"/>
  <circle cx="500" cy="120" r="3" fill="#2563eb" opacity="0.6"/>
  <circle cx="900" cy="120" r="3" fill="#22c55e" opacity="0.6"/>
</svg>
