<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-label="3D 工业能源设施数字孪生">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="4"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
    </filter>
    <radialGradient id="dataGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1400" height="800" fill="url(#bgGrad)"/>

  <!-- 背景网格线 -->
  <g opacity="0.1" stroke="#2563eb" stroke-width="0.5">
    <line x1="0" y1="400" x2="1400" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
  </g>

  <!-- 左侧：能源采集设备 -->
  <!-- 太阳能板组 -->
  <g opacity="0.9">
    <rect x="150" y="200" width="120" height="80" fill="#e0f2fe" stroke="#2563eb" stroke-width="2" filter="url(#glow)"/>
    <line x1="150" y1="240" x2="270" y2="240" stroke="#22c55e" stroke-width="1"/>
    <line x1="150" y1="260" x2="270" y2="260" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
    <text x="210" y="250" fill="#2563eb" font-family="system-ui" font-size="12" font-weight="600" text-anchor="middle">太阳能</text>
    <circle cx="210" cy="220" r="4" fill="#22c55e" filter="url(#strongGlow)"/>
  </g>

  <!-- 风力发电机 -->
  <g opacity="0.9">
    <line x1="320" y1="180" x2="320" y2="340" stroke="#0ea5e9" stroke-width="3" opacity="0.7"/>
    <circle cx="320" cy="160" r="35" fill="none" stroke="#22c55e" stroke-width="2" filter="url(#glow)"/>
    <path d="M 320 130 L 340 170 L 300 170 Z" fill="#22c55e" opacity="0.7"/>
    <path d="M 320 130 L 330 155 L 310 155 Z" fill="#2563eb" opacity="0.6"/>
    <text x="320" y="360" fill="#2563eb" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle">风能</text>
  </g>

  <!-- 中心：主要工厂/能源设施 -->
  <!-- 左侧面（深色） -->
  <g opacity="0.95">
    <polygon points="500,250 500,450 650,500 650,300" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" filter="url(#glow)"/>

    <!-- 顶面（亮色） -->
    <polygon points="500,250 650,300 800,250 650,200" fill="#e0f2fe" stroke="#2563eb" stroke-width="2.5"/>

    <!-- 右侧面 -->
    <polygon points="650,300 800,250 800,450 650,500" fill="#f0f9ff" stroke="#22c55e" stroke-width="2.5"/>

    <!-- 烟囱/冷却塔 -->
    <rect x="680" y="180" width="40" height="120" fill="#e0f2fe" stroke="#2563eb" stroke-width="2" opacity="0.8"/>
    <ellipse cx="700" cy="175" rx="22" ry="8" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.6"/>
    <path d="M 690 160 Q 700 145 710 160" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.5"/>

    <!-- 配电设备 -->
    <rect x="730" y="320" width="30" height="45" fill="#dbeafe" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="745" cy="330" r="4" fill="#22c55e" filter="url(#strongGlow)"/>
    <circle cx="745" cy="350" r="4" fill="#22c55e" filter="url(#strongGlow)"/>
  </g>

  <!-- 工业机器臂 -->
  <g opacity="0.85">
    <line x1="820" y1="350" x2="920" y2="300" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
    <circle cx="920" cy="300" r="18" fill="#e0f2fe" stroke="#22c55e" stroke-width="2" filter="url(#glow)"/>
    <path d="M 920 285 L 935 295 L 920 310 Z" fill="#22c55e" opacity="0.7"/>
  </g>

  <!-- 右侧：监控和数据 -->
  <!-- 监控屏幕 -->
  <g opacity="0.9">
    <rect x="1050" y="280" width="160" height="120" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5" filter="url(#glow)" rx="4"/>
    <rect x="1060" y="295" width="140" height="85" fill="#e0f2fe" stroke="#22c55e" stroke-width="1" opacity="0.6"/>

    <!-- 屏幕数据 -->
    <text x="1130" y="315" fill="#22c55e" font-family="system-ui" font-size="14" font-weight="700" text-anchor="middle">实时监控</text>
    <polyline points="1070,340 1090,325 1110,335 1130,320 1150,330 1170,315 1190,328"
              stroke="#22c55e" stroke-width="1.5" fill="none" filter="url(#glow)"/>
    <circle cx="1130" cy="360" r="3" fill="#2563eb"/>
    <circle cx="1150" cy="362" r="3" fill="#22c55e"/>
  </g>

  <!-- 数据流线条（从工厂到屏幕） -->
  <g opacity="0.5">
    <path d="M 800 380 Q 900 350 1050 320" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5" filter="url(#glow)"/>
    <circle cx="850" cy="368" r="3" fill="#2563eb"/>
    <circle cx="920" cy="345" r="3" fill="#22c55e"/>
  </g>

  <!-- 底部：能源流向数据 -->
  <!-- 能耗指标 -->
  <g opacity="0.85">
    <rect x="480" y="550" width="140" height="80" fill="#f8fafc" stroke="#22c55e" stroke-width="2" rx="4" filter="url(#glow)"/>
    <text x="550" y="575" fill="#22c55e" font-family="system-ui" font-size="13" font-weight="600" text-anchor="middle">总能耗</text>
    <text x="550" y="600" fill="#16a34a" font-family="system-ui" font-size="18" font-weight="700" text-anchor="middle">2,847 kW</text>

    <rect x="680" y="550" width="140" height="80" fill="#f8fafc" stroke="#2563eb" stroke-width="2" rx="4" filter="url(#glow)"/>
    <text x="750" y="575" fill="#2563eb" font-family="system-ui" font-size="13" font-weight="600" text-anchor="middle">效率等级</text>
    <text x="750" y="600" fill="#1d4ed8" font-family="system-ui" font-size="18" font-weight="700" text-anchor="middle">92.3%</text>

    <rect x="880" y="550" width="140" height="80" fill="#f8fafc" stroke="#22c55e" stroke-width="2" rx="4" filter="url(#glow)"/>
    <text x="950" y="575" fill="#22c55e" font-family="system-ui" font-size="13" font-weight="600" text-anchor="middle">碳排放</text>
    <text x="950" y="600" fill="#16a34a" font-family="system-ui" font-size="18" font-weight="700" text-anchor="middle">↓ 28%</text>
  </g>

  <!-- 中心发光圆形（能源核心） -->
  <g opacity="0.3">
    <circle cx="700" cy="380" r="180" fill="url(#dataGlow)"/>
    <circle cx="700" cy="380" r="150" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.4"/>
    <circle cx="700" cy="380" r="120" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- 顶部标题区 -->
  <g opacity="0.8">
    <text x="700" y="80" fill="#22c55e" font-family="system-ui" font-size="28" font-weight="700" text-anchor="middle">能源数字孪生系统</text>
    <text x="700" y="110" fill="#2563eb" font-family="system-ui" font-size="14" text-anchor="middle">Industrial IoT Twin Platform</text>
  </g>
</svg>
